---
- name: Reset Demo State
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: List loaded kpatch modules
      ansible.builtin.command: kpatch list
      register: kpatch_list
      changed_when: false
      failed_when: false

    - name: Unload all kpatch modules
      ansible.builtin.shell: |
        for mod in $(kpatch list 2>/dev/null | grep -oP 'kpatch_\S+'); do
          kpatch unload "$mod" || true
        done
      when: kpatch_list.rc == 0
      changed_when: true

    - name: Remove kpatch-patch RPMs
      ansible.builtin.shell: dnf remove -y 'kpatch-patch-*' 'kpatch' 'kpatch-dnf' 2>/dev/null || true
      changed_when: true

    - name: Clean up SBOM artefacts
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/sbom-before.json
        - /tmp/sbom-after.json

    - name: Verify kpatch is removed
      ansible.builtin.command: kpatch list
      register: verify_reset
      changed_when: false
      failed_when: false

    - name: Display reset status
      ansible.builtin.debug:
        msg: |
          === Demo State Reset ===
          Kpatch modules: {{ 'none loaded' if verify_reset.rc != 0 else verify_reset.stdout }}
          SBOM artefacts: cleaned
          Ready for next demo run
