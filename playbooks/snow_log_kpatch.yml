---
- name: Log Follow-up Scheduled CR
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create scheduled CR for follow-up full kernel update
      servicenow.itsm.change_request:
        type: standard
        state: new
        short_description: >-
          [SCHEDULED] Full kernel update required — follow-up to {{ cr_number | default('emergency kpatch') }}
        description: |
          A kpatch was applied to mitigate immediate CVE risk across all environments
          (dev canary + production), but kpatch is a stop-gap measure. Red Hat mandates
          a full kernel update and reboot at least twice per year to remain within the
          supported patch cadence.

          This CR tracks the follow-up full kernel update that should be completed
          during the next scheduled maintenance window.

          Related emergency CR: {{ cr_number | default('N/A') }}
          Related Incident: {{ inc_number | default('N/A') }}
          Advisory: {{ advisory_id | default('N/A') }}
          Kernel: {{ kernel_version | default('unknown') }}
          CVEs mitigated by kpatch: {{ cves_patched | default([]) | join(', ') }}

          Hosts requiring full kernel update + reboot:
          - rhel-dev-01, rhel-dev-02, rhel-dev-03
          - rhel-prod-01, rhel-prod-02, rhel-prod-03

          Action required: Schedule full kernel update + reboot within 30 days.
        priority: 3
        risk: low
        impact: 3
        category: Software
        other:
          parent: "{{ inc_sys_id | default(omit) }}"
      register: followup_cr

    - name: Display follow-up CR confirmation
      ansible.builtin.debug:
        msg: |
          === Follow-up CR Created ===
          Number: {{ followup_cr.record.number }}
          Type: Standard (scheduled)
          Action: Full kernel update + reboot within 30 days
          Linked to: {{ inc_number | default('N/A') }}

    - name: Publish follow-up CR identifiers
      ansible.builtin.set_stats:
        data:
          followup_cr_number: "{{ followup_cr.record.number }}"
