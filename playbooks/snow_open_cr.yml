---
- name: Raise Emergency Change Request
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Look up Trading Platform business service
      servicenow.itsm.configuration_item_info:
        query:
          - name: = Trading Platform
      register: biz_svc_lookup

    - name: Look up Trading Platform (Prod) in CMDB
      servicenow.itsm.configuration_item_info:
        query:
          - name: = Trading Platform (Prod)
      register: app_prod_lookup

    - name: Create emergency Change Request with canary evidence
      servicenow.itsm.change_request:
        type: emergency
        state: new
        short_description: >-
          Emergency kpatch — {{ advisory_id | default('RHSA-2026:25217') }}
          ({{ cves_patched | default([]) | length }} CVEs) — production fleet
        description: |
          Emergency Change Request for production kpatch deployment.

          Advisory: {{ advisory_id | default('RHSA-2026:25217') }}
          Severity: {{ severity | default('Critical') }}
          Kernel: {{ kernel_version | default('unknown') }}
          CVEs: {{ cve_list | default([]) | join(', ') }}
          Related Incident: {{ inc_number | default('N/A') }}

          ══════════════════════════════════════════════════════
          CANARY DEPLOYMENT EVIDENCE (Dev Environment)
          ══════════════════════════════════════════════════════

          Dev hosts patched: rhel-dev-01.trading-demo.chrislab.dev, rhel-dev-02.trading-demo.chrislab.dev, rhel-dev-03.trading-demo.chrislab.dev
          Patch strategy: kpatch (live, zero downtime)
          CVEs remediated: {{ cves_patched | default([]) | join(', ') }}
          Services healthy post-patch: {{ services_healthy | default('yes') }}
          SBOM diff: {{ sbom_diff_summary.changed | default({}) | length }} RPMs changed

          {{ audit_report | default('') }}

          ══════════════════════════════════════════════════════
          PRODUCTION HOSTS PENDING APPROVAL
          ══════════════════════════════════════════════════════

          - rhel-prod-01.trading-demo.chrislab.dev
          - rhel-prod-02.trading-demo.chrislab.dev
          - rhel-prod-03.trading-demo.chrislab.dev

          Identical kpatch will be applied to production upon approval.
          Zero downtime expected — live kernel patching, no reboot.

          Requesting emergency approval to proceed.
        priority: 1
        risk: low
        impact: 2
        category: Software
        assignment_group: "CAB Approval"
        other:
          parent: "{{ inc_prod_sys_id | default(inc_sys_id) | default(omit) }}"
          cmdb_ci: "{{ app_prod_lookup.records[0].sys_id | default(omit) }}"
          business_service: "{{ biz_svc_lookup.records[0].sys_id | default(omit) }}"
      register: cr_result

    - name: Progress CR to Authorize and request approval
      servicenow.itsm.change_request:
        number: "{{ cr_result.record.number }}"
        state: authorize
        assignment_group: "CAB Approval"
        other:
          approval: requested

    - name: Update Dev Incident with CR reference
      servicenow.itsm.incident:
        sys_id: "{{ inc_sys_id }}"
        other:
          work_notes: >-
            Dev canary deployment completed successfully.
            Emergency CR {{ cr_result.record.number }} raised for production kpatch.
      when: inc_sys_id is defined

    - name: Update Prod Incident with CR reference
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: >-
            Emergency CR {{ cr_result.record.number }} raised for production kpatch.
            Dev canary passed — awaiting CAB approval before production remediation.
      when: inc_prod_sys_id is defined

    - name: Display CR details
      ansible.builtin.debug:
        msg: |
          === Emergency Change Request Created ===
          Number: {{ cr_result.record.number }}
          Sys ID: {{ cr_result.record.sys_id }}
          Linked to Incident: {{ inc_number | default('N/A') }}
          Dev canary: PASSED
          Awaiting approval for production kpatch.

    - name: Publish CR identifiers
      ansible.builtin.set_stats:
        data:
          cr_sys_id: "{{ cr_result.record.sys_id }}"
          cr_number: "{{ cr_result.record.number }}"
