---
- name: Raise Emergency Change Request
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Look up Trading Service business service
      servicenow.itsm.configuration_item_info:
        query:
          - name: = Trading Service
      register: biz_svc_lookup

    - name: Look up Trading Service (Prod) in CMDB
      servicenow.itsm.configuration_item_info:
        query:
          - name: = Trading Service (Prod)
      register: app_prod_lookup

    - name: Create emergency Change Request with canary evidence
      servicenow.itsm.change_request:
        type: emergency
        state: new
        short_description: >-
          Emergency kpatch — {{ advisory_id | default('RHSA-2026:25217') }}
          ({{ cves_patched | default([]) | length }} CVEs) — production fleet
        description: |
          Red Hat Insights has detected a critical kernel vulnerability
          ({{ advisory_id | default('RHSA-2026:25217') }}) affecting the
          Trading Service production fleet.

          A canary deployment has been successfully completed across the
          dev environment with zero service impact. This CR requests
          approval to apply the identical kpatch to production.

          Advisory: {{ advisory_id | default('RHSA-2026:25217') }}
          Severity: {{ severity | default('Critical') }}
          Kernel: {{ kernel_version | default('unknown') }}
          CVEs: {{ cve_list | default([]) | join(', ') }}
          Related Dev Incident: {{ inc_number | default('N/A') }}
          Related Prod Incident: {{ inc_prod_number | default('N/A') }}
        priority: 1
        risk: low
        impact: 2
        category: Software
        assignment_group: "CAB Approval"
        other:
          parent: "{{ inc_prod_sys_id | default(inc_sys_id) | default(omit) }}"
          cmdb_ci: "{{ app_prod_lookup.records[0].sys_id | default(omit) }}"
          business_service: "{{ biz_svc_lookup.records[0].sys_id | default(omit) }}"
          justification: |
            Red Hat Insights has identified {{ advisory_id | default('RHSA-2026:25217') }}
            as a critical kernel vulnerability (CVSS 8.8) affecting all Trading Service
            nodes. The vulnerability allows remote exploitation and must be remediated
            immediately to maintain the security posture of the platform.

            A canary kpatch was successfully deployed to the dev environment:
            - Dev hosts patched: rhel-dev-01, rhel-dev-02, rhel-dev-03
            - Strategy: kpatch (live kernel patching, zero downtime)
            - Services healthy post-patch: {{ services_healthy | default('yes') }}
            - Trading Service service: UP across all dev nodes
            - SBOM diff: {{ sbom_diff_summary.added | default([]) | length }} RPMs added, {{ sbom_diff_summary.changed | default({}) | length }} RPMs changed

            {{ audit_report | default('') }}
          implementation_plan: |
            Implementation is fully automated by Ansible Automation Platform.
            AAP Workflow Job ID: {{ tower_workflow_job_id | default(awx_workflow_job_id | default('N/A')) }}

            When this CR is approved and moved to the Implement state in ServiceNow,
            Event-Driven Ansible will detect the state change and automatically resume
            the paused workflow to execute the following steps:

            1. Apply kpatch to production nodes (rhel-prod-01, rhel-prod-02, rhel-prod-03)
               — live kernel patching, zero reboot required.
            2. Run post-checks: verify kpatch loaded, critical services healthy,
               Trading Service responding on all production nodes.
            3. Generate post-patch SBOM and compute diff against baseline.
            4. Update CMDB Configuration Items with new kernel patch level.
            5. Force Red Hat Insights check-in to confirm CVE remediation.
            6. Resolve production incident and move this CR to Review.

            Estimated duration: < 5 minutes from approval
            Service impact: None (live kernel patching)
          backout_plan: |
            If post-checks fail on any production node:
            1. Unload kpatch module: sudo kpatch unload --all
            2. Verify services recover to healthy state.
            3. Escalate to platform engineering for manual investigation.

            Note: kpatch unload restores the original kernel behaviour without
            requiring a reboot. No data loss or service restart is expected.
          test_plan: |
            Automated post-checks will verify:
            1. kpatch module is loaded and active on each production node.
            2. Critical services (sshd, chronyd) are running.
            3. Trading Service service health endpoint responds on each node.
            4. Post-patch SBOM is generated and diffed against pre-patch baseline.
            5. Red Hat Insights check-in confirms updated system state.

            All checks must pass before the CR is moved to Review.
      register: cr_result

    - name: Progress CR to Authorize and request approval
      servicenow.itsm.change_request:
        number: "{{ cr_result.record.number }}"
        state: authorize
        assignment_group: "CAB Approval"
        other:
          approval: requested
          assigned_to: "{{ servicenow_approver | default('admin') }}"

    - name: Update Dev Incident with CR reference
      servicenow.itsm.incident:
        sys_id: "{{ inc_sys_id }}"
        other:
          work_notes: >-
            Dev canary deployment completed successfully.
            Emergency CR {{ cr_result.record.number }} raised for production kpatch.
      when: inc_sys_id is defined

    - name: Update Prod Incident with CR reference
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: >-
            Emergency CR {{ cr_result.record.number }} raised for production kpatch.
            Dev canary passed — awaiting CAB approval before production remediation.
      when: inc_prod_sys_id is defined

    - name: Display CR details
      ansible.builtin.debug:
        msg: |
          === Emergency Change Request Created ===
          Number: {{ cr_result.record.number }}
          Sys ID: {{ cr_result.record.sys_id }}
          Linked to Incident: {{ inc_number | default('N/A') }}
          Dev canary: PASSED
          Awaiting approval for production kpatch.

    - name: Publish CR identifiers
      ansible.builtin.set_stats:
        data:
          cr_sys_id: "{{ cr_result.record.sys_id }}"
          cr_number: "{{ cr_result.record.number }}"
