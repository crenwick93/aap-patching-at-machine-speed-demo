---
- name: Apply Kpatch
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install kpatch-dnf plugin
      ansible.builtin.dnf:
        name: kpatch-dnf
        state: present

    - name: Install kpatch-patch for running kernel
      ansible.builtin.command: dnf kpatch auto -y
      register: kpatch_install
      changed_when: "'Nothing to do' not in kpatch_install.stdout"

    - name: Verify kpatch module loaded
      ansible.builtin.command: kpatch list
      register: kpatch_list
      changed_when: false

    - name: Extract CVEs patched by kpatch
      ansible.builtin.shell: >
        kpatch list 2>/dev/null | grep -oP 'CVE-\d{4}-\d+' | sort -u
      register: kpatch_cves
      changed_when: false
      failed_when: false

    - name: Publish patch results
      ansible.builtin.set_stats:
        data:
          patch_result: success
          strategy_used: kpatch
          cves_patched: "{{ kpatch_cves.stdout_lines | default([]) }}"
          patch_timestamp: "{{ ansible_date_time.iso8601 }}"
        aggregate: false

    - name: Display patch summary
      ansible.builtin.debug:
        msg: |
          === Kpatch Applied ===
          Host: {{ inventory_hostname }}
          CVEs patched: {{ kpatch_cves.stdout_lines | default([]) | length }}
          Reboot required: no
          Zero downtime, zero service interruption.
