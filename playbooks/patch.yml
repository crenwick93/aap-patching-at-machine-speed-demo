---
- name: Update Incident — kpatch starting
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add work note — applying kpatch to dev canary
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Applying kpatch to dev canary nodes.

            Strategy: kpatch (live kernel patching — zero downtime)
            Target hosts: rhel-dev-01, rhel-dev-02, rhel-dev-03
            AAP Workflow Job: {{ tower_workflow_job_id | default(awx_workflow_job_id | default('N/A')) }}
      when:
        - cr_number is not defined
        - inc_dev_sys_id is defined

    - name: Add work note — CR approved, applying kpatch to production
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Emergency CR {{ cr_number }} has been approved.
            Applying kpatch to production nodes now.

            Strategy: kpatch (live kernel patching — zero downtime)
            Target hosts: rhel-prod-01, rhel-prod-02, rhel-prod-03
            AAP Workflow Job: {{ tower_workflow_job_id | default(awx_workflow_job_id | default('N/A')) }}
      when:
        - cr_number is defined
        - inc_prod_sys_id is defined

- name: Apply Kpatch
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Install kpatch-dnf plugin
      ansible.builtin.dnf:
        name: kpatch-dnf
        state: present

    - name: Install kpatch-patch for running kernel
      ansible.builtin.command: dnf kpatch auto -y
      register: kpatch_install
      changed_when: "'Nothing to do' not in kpatch_install.stdout"

    - name: Verify kpatch module loaded
      ansible.builtin.command: kpatch list
      register: kpatch_list
      changed_when: false

    - name: Extract CVEs patched by kpatch
      ansible.builtin.shell: >
        kpatch list 2>/dev/null | grep -oP 'CVE-\d{4}-\d+' | sort -u
      register: kpatch_cves
      changed_when: false
      failed_when: false

    - name: Publish patch results
      ansible.builtin.set_stats:
        data:
          patch_result: success
          strategy_used: kpatch
          cves_patched: "{{ kpatch_cves.stdout_lines | default([]) }}"
          patch_timestamp: "{{ ansible_date_time.iso8601 }}"
        aggregate: false

    - name: Display patch summary
      ansible.builtin.debug:
        msg: |
          === Kpatch Applied ===
          Host: {{ inventory_hostname }}
          CVEs patched: {{ kpatch_cves.stdout_lines | default([]) | length }}
          Reboot required: no
          Zero downtime, zero service interruption.

- name: Update Incident — kpatch applied successfully
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add work note — kpatch successfully applied to dev canary
      servicenow.itsm.incident:
        sys_id: "{{ inc_dev_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Kpatch successfully applied to all dev canary nodes.

            CVEs patched: {{ cves_patched | default([]) | join(', ') }}
            Strategy: kpatch (zero reboot, zero downtime)
            Patch result: SUCCESS

            Proceeding to raise emergency CR for production deployment.
      when:
        - cr_number is not defined
        - inc_dev_sys_id is defined

    - name: Add work note — kpatch successfully applied to production
      servicenow.itsm.incident:
        sys_id: "{{ inc_prod_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Kpatch successfully applied to all production nodes.

            CVEs patched: {{ cves_patched | default([]) | join(', ') }}
            Strategy: kpatch (zero reboot, zero downtime)
            Patch result: SUCCESS

            Running post-implementation checks now.
      when:
        - cr_number is defined
        - inc_prod_sys_id is defined
