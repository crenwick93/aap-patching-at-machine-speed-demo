---
- name: Kpatch Decision Gate
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check kpatch eligibility from assessment
      ansible.builtin.assert:
        that:
          - kpatch_eligible | default(false) | bool
        fail_msg: >-
          Kpatch is NOT available for kernel {{ kernel_version | default('unknown') }}.
          Routing to governed full-update path with Change Request approval.
        success_msg: >-
          Kpatch IS available for kernel {{ kernel_version | default('unknown') }}.
          Proceeding with automated live patching -- no approval required.
