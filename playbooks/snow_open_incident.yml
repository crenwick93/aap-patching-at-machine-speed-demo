---
- name: Open Incident for CVE Response
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    domain: trading-demo.chrislab.dev

  tasks:
    - name: Look up Trading Platform business service
      servicenow.itsm.configuration_item_info:
        query:
          - name: = Trading Platform
      register: biz_svc_lookup

    - name: Look up Trading Platform (Dev) application service
      servicenow.itsm.configuration_item_info:
        query:
          - name: = Trading Platform (Dev)
      register: app_dev_lookup

    - name: Create security Incident
      servicenow.itsm.incident:
        state: new
        impact: high
        urgency: high
        short_description: >-
          Critical kernel CVE detected — {{ advisory_id | default('RHSA-2026:25217') }}
          affecting Trading Platform (6 RHEL hosts)
        description: |
          Red Hat Lightspeed detected a critical kernel security advisory
          affecting the Trading Platform infrastructure.

          Advisory: {{ advisory_id | default('RHSA-2026:25217') }}
          Severity: {{ severity | default('Critical') }}
          Synopsis: {{ synopsis | default('Important: kernel security update') }}
          CVEs: {{ cve_list | default([]) | join(', ') }}
          Trigger host: {{ affected_host | default('N/A') }}

          Affected services:
            Trading Platform (Dev)  — rhel-dev-01.{{ domain }}, rhel-dev-02.{{ domain }}, rhel-dev-03.{{ domain }}
            Trading Platform (Prod) — rhel-prod-01.{{ domain }}, rhel-prod-02.{{ domain }}, rhel-prod-03.{{ domain }}

          Automated triage initiated by Event-Driven Ansible.
          AAP workflow will:
            1. Pre-check and assess all hosts in the Trading Platform fleet
            2. Run canary kpatch on dev environment
            3. Validate services post-patch
            4. Raise emergency CR for production
            5. Await approval, then kpatch production
            6. Update CMDB CIs with new kernel version
        caller: "{{ servicenow_caller | default('aap-svc-crenwick') }}"
        other:
          category: Software
          subcategory: Operating System
          cmdb_ci: "{{ app_dev_lookup.records[0].sys_id | default(omit) }}"
          business_service: "{{ biz_svc_lookup.records[0].sys_id | default(omit) }}"
      register: inc_result

    - name: Add affected CIs as work note
      servicenow.itsm.incident:
        sys_id: "{{ inc_result.record.sys_id }}"
        other:
          work_notes: |
            Affected Configuration Items:
            Dev environment:
            - rhel-dev-01.{{ domain }}
            - rhel-dev-02.{{ domain }}
            - rhel-dev-03.{{ domain }}
            Prod environment:
            - rhel-prod-01.{{ domain }}
            - rhel-prod-02.{{ domain }}
            - rhel-prod-03.{{ domain }}

            Automated assessment in progress via AAP.

    - name: Display Incident details
      ansible.builtin.debug:
        msg: |
          === Incident Created ===
          Number: {{ inc_result.record.number }}
          Sys ID: {{ inc_result.record.sys_id }}
          Priority: {{ inc_result.record.priority }}
          Awaiting triage by AAP workflow.

    - name: Publish Incident identifiers
      ansible.builtin.set_stats:
        data:
          inc_sys_id: "{{ inc_result.record.sys_id }}"
          inc_number: "{{ inc_result.record.number }}"
