---
# =============================================================================
# AAP Configuration as Code — CVE Kpatch Response
# =============================================================================

# Using the Default organization

# -----------------------------------------------------------------------------
# Credentials
# -----------------------------------------------------------------------------
controller_credentials:
  - name: "Demo SSH Key"
    description: "SSH access to demo EC2 instances (ec2-user)"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: ec2-user
      ssh_key_data: "{{ probe_ssh_key }}"

  - name: "AWS Demo"
    description: "AWS credentials for dynamic EC2 inventory discovery"
    organization: "Default"
    credential_type: "Amazon Web Services"
    inputs:
      username: "{{ aws_access_key }}"
      password: "{{ aws_secret_key }}"

  - name: "ServiceNow PDI"
    description: "ServiceNow developer instance for ITSM integration"
    organization: "Default"
    credential_type: "ServiceNow Credential"
    inputs:
      SN_HOST: "{{ servicenow_instance_url }}"
      SN_USERNAME: "{{ servicenow_username }}"
      SN_PASSWORD: "{{ servicenow_password }}"

  - name: "AAP Controller"
    description: "Controller credential for internal workflow approval automation"
    organization: "Default"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ aap_internal_host }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

# -----------------------------------------------------------------------------
# Projects
# -----------------------------------------------------------------------------
controller_projects:
  - name: "Patching at Machine Speed"
    description: "EDA-driven enterprise kernel patching with ServiceNow governance"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

# -----------------------------------------------------------------------------
# Inventories
# -----------------------------------------------------------------------------
controller_inventories:
  - name: "Patching Demo"
    description: "Demo RHEL instances — 3 dev + 3 prod, discovered dynamically from AWS EC2"
    organization: "Default"

# -----------------------------------------------------------------------------
# Inventory Sources (dynamic — AWS EC2 with dev/prod grouping)
# -----------------------------------------------------------------------------
controller_inventory_sources:
  - name: "AWS EC2 Discovery"
    inventory: "Patching Demo"
    source: "ec2"
    credential: "AWS Demo"
    overwrite: true
    update_on_launch: true
    source_vars:
      plugin: amazon.aws.aws_ec2
      regions:
        - eu-west-1
      filters:
        "tag:demo": patching
      hostnames:
        - tag:Name
      keyed_groups:
        - key: tags.env
          prefix: tag_env
      compose:
        ansible_host: public_ip_address
        ansible_user: "'ec2-user'"
        ansible_become: "true"

# -----------------------------------------------------------------------------
# Job Templates
# -----------------------------------------------------------------------------
controller_templates:
  - name: "Pre-check System Readiness"
    description: "Gate: disk, memory, services, load — is this system safe to patch?"
    organization: "Default"
    job_type: "run"
    project: "Patching at Machine Speed"
    playbook: "playbooks/precheck.yml"
    inventory: "Patching Demo"
    ask_limit_on_launch: true
    credentials:
      - "Demo SSH Key"

  - name: "Assess Kernel Exposure"
    description: "Intelligence: kernel version, advisories, CVEs, kpatch eligibility, SBOM"
    organization: "Default"
    job_type: "run"
    project: "Patching at Machine Speed"
    playbook: "playbooks/assess.yml"
    inventory: "Patching Demo"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "Demo SSH Key"
      - "ServiceNow PDI"

  - name: "Apply Kpatch"
    description: "Live kernel patch — zero downtime, zero service interruption"
    organization: "Default"
    job_type: "run"
    project: "Patching at Machine Speed"
    playbook: "playbooks/patch.yml"
    inventory: "Patching Demo"
    ask_limit_on_launch: true
    credentials:
      - "Demo SSH Key"

  - name: "Post-checks"
    description: "Verify kpatch loaded, services healthy, Trading Platform UP, SBOM diff, CI update"
    organization: "Default"
    job_type: "run"
    project: "Patching at Machine Speed"
    playbook: "playbooks/validate.yml"
    inventory: "Patching Demo"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "Demo SSH Key"
      - "ServiceNow PDI"

  - name: "Open Incident"
    description: "Create security Incident in ServiceNow linked to affected CIs"
    organization: "Default"
    job_type: "run"
    project: "Patching at Machine Speed"
    playbook: "playbooks/snow_open_incident.yml"
    inventory: "Patching Demo"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow PDI"

  - name: "Open Emergency CR"
    description: "Raise emergency CR with canary evidence, await approval for production"
    organization: "Default"
    job_type: "run"
    project: "Patching at Machine Speed"
    playbook: "playbooks/snow_open_cr.yml"
    inventory: "Patching Demo"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow PDI"

  - name: "Post-Implementation Review"
    description: "CR to Review + log follow-up CR for full kernel update"
    organization: "Default"
    job_type: "run"
    project: "Patching at Machine Speed"
    playbook: "playbooks/snow_close_out.yml"
    inventory: "Patching Demo"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow PDI"

  - name: "Bridge CR Approval"
    description: "Relay ServiceNow CR approval to the paused AAP workflow node"
    organization: "Default"
    job_type: "run"
    project: "Patching at Machine Speed"
    playbook: "playbooks/approve_pending_workflow.yml"
    inventory: "Patching Demo"
    ask_variables_on_launch: true
    credentials:
      - "AAP Controller"


# -----------------------------------------------------------------------------
# Workflow: CVE Kpatch Response
# -----------------------------------------------------------------------------
controller_workflows:
  - name: "CVE Kpatch Response"
    description: >-
      EDA-triggered single workflow: open Incident, run canary kpatch on dev,
      raise emergency CR for prod, await approval, kpatch prod, close ITIL records.
    organization: "Default"
    ask_variables_on_launch: true
    simplified_workflow_nodes:

      # --- Phase 1: ITIL Initiation ---
      - identifier: "Open Incident"
        unified_job_template: "Open Incident"
        success_nodes:
          - "Assess & SBOM Baseline"

      # --- Phase 1: Assessment ---
      - identifier: "Assess & SBOM Baseline"
        unified_job_template: "Assess Kernel Exposure"
        success_nodes:
          - "Pre-check All Hosts"

      - identifier: "Pre-check All Hosts"
        unified_job_template: "Pre-check System Readiness"
        success_nodes:
          - "Canary: Apply Kpatch"

      # --- Phase 2: Dev Canary ---
      - identifier: "Canary: Apply Kpatch"
        unified_job_template: "Apply Kpatch"
        limit: "tag_env_dev"
        success_nodes:
          - "Canary: Post-checks"

      - identifier: "Canary: Post-checks"
        unified_job_template: "Post-checks"
        limit: "tag_env_dev"
        success_nodes:
          - "Open Emergency CR"

      # --- Phase 3: Governed Production Deployment ---
      - identifier: "Open Emergency CR"
        unified_job_template: "Open Emergency CR"
        success_nodes:
          - "Awaiting CR Approval"

      - identifier: "Awaiting CR Approval"
        approval_node:
          name: "Awaiting CR Approval"
          description: >-
            Workflow paused — waiting for ServiceNow emergency CR approval.
            EDA will auto-approve this node when the CR is approved in ServiceNow.
          timeout: 0
        success_nodes:
          - "Apply Kpatch (Prod)"

      - identifier: "Apply Kpatch (Prod)"
        unified_job_template: "Apply Kpatch"
        limit: "tag_env_prod"
        success_nodes:
          - "Post-checks (Prod)"

      - identifier: "Post-checks (Prod)"
        unified_job_template: "Post-checks"
        limit: "tag_env_prod"
        success_nodes:
          - "Post-Implementation Review"

      # --- Phase 4: Post-Implementation Review ---
      - identifier: "Post-Implementation Review"
        unified_job_template: "Post-Implementation Review"

# =============================================================================
# Event-Driven Ansible
# =============================================================================

# -----------------------------------------------------------------------------
# EDA Decision Environments
# -----------------------------------------------------------------------------
eda_decision_environments:
  - name: "ServiceNow DE"
    description: "Decision environment with servicenow.itsm for CR polling"
    organization: "Default"
    image_url: "quay.io/crenwick93/snow-de:latest"

# -----------------------------------------------------------------------------
# EDA Projects
# -----------------------------------------------------------------------------
eda_projects:
  - name: "Patching at Machine Speed"
    description: "EDA rulebooks for CVE response and ServiceNow approval bridge"
    organization: "Default"
    url: "{{ git_repo_url }}"
    wait: true

# -----------------------------------------------------------------------------
# EDA Credentials
# -----------------------------------------------------------------------------
eda_credentials:
  - name: "AAP Controller Token"
    description: "Controller credential so EDA can launch workflow templates"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "Default"
    inputs:
      host: "{{ (aap_hostname | regex_replace('/+$','')) ~ '/api/controller/' }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "ServiceNow EDA"
    description: "ServiceNow credentials for the EDA records source plugin"
    credential_type: "ServiceNow Credential"
    organization: "Default"
    inputs:
      SN_HOST: "{{ servicenow_instance_url }}"
      SN_USERNAME: "{{ servicenow_username }}"
      SN_PASSWORD: "{{ servicenow_password }}"

  - name: "Lightspeed CVE Events token"
    description: "Token auth for simulated Lightspeed CVE webhook events"
    credential_type: "Token Event Stream"
    organization: "Default"
    inputs:
      auth_type: token
      token: "{{ eda_event_stream_token }}"
      http_header_key: Authorization

# -----------------------------------------------------------------------------
# Event Streams
# -----------------------------------------------------------------------------
eda_event_streams:
  - name: "Lightspeed CVE Events token"
    organization: "Default"
    credential_name: "Lightspeed CVE Events token"
    event_stream_type: token
    test_mode: false

# -----------------------------------------------------------------------------
# Rulebook Activations
# -----------------------------------------------------------------------------
eda_rulebook_activations:
  - name: "CVE Response"
    description: "Monitors Lightspeed for CVE events and ServiceNow for CR approvals"
    organization: "Default"
    project: "Patching at Machine Speed"
    rulebook: "cve_response.yml"
    decision_environment: "ServiceNow DE"
    enabled: true
    source_mappings:
      - source_name: insights_events
        event_stream_name: "Lightspeed CVE Events token"
    eda_credentials:
      - "AAP Controller Token"
      - "ServiceNow EDA"
