---
- name: Apply AAP objects — Patching at Machine Speed
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - infra.aap_configuration

  vars:
    aap_hostname: "{{ lookup('env', 'AAP_HOSTNAME') | default(omit, true) }}"
    aap_internal_host: "{{ lookup('env', 'AAP_INTERNAL_HOST') | default(aap_hostname, true) }}"
    aap_token: "{{ lookup('env', 'AAP_TOKEN') | default(omit, true) }}"
    aap_validate_certs: "{{ (lookup('env', 'AAP_VALIDATE_CERTS') | default('false', true)) | bool }}"

    controller_host: "{{ aap_hostname }}"
    controller_oauthtoken: "{{ aap_token }}"
    controller_validate_certs: "{{ aap_validate_certs }}"

    aap_configuration_secure_logging: false
    aap_configuration_collect_logs: true
    aap_configuration_async_retries: 60
    aap_configuration_async_delay: 5

    probe_ssh_key: "{{ lookup('file', probe_ssh_key_path, errors='ignore') | default(omit, true) }}"
    probe_ssh_key_path: "{{ lookup('env', 'PROBE_SSH_KEY_PATH') | default('./colombo-demo.pem', true) }}"

    aws_access_key: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | default(omit, true) }}"
    aws_secret_key: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | default(omit, true) }}"

    git_repo_url: "{{ lookup('env', 'GIT_REPO_URL') | default('https://github.com/crenwick93/aap-patching-at-machine-speed-demo.git', true) }}"

    servicenow_instance_url: "{{ lookup('env', 'SERVICENOW_INSTANCE_URL') | default(omit, true) }}"
    servicenow_username: "{{ lookup('env', 'SERVICENOW_USERNAME') | default(omit, true) }}"
    servicenow_password: "{{ lookup('env', 'SERVICENOW_PASSWORD') | default(omit, true) }}"

    eda_event_stream_token: "{{ lookup('env', 'EDA_EVENT_STREAM_TOKEN') | default(omit, true) }}"

  vars_files:
    - vars.yml
  roles:
    - role: infra.aap_configuration.dispatch

  post_tasks:
    - name: Look up event streams
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/event-streams/"
        method: GET
        headers:
          Authorization: "Bearer {{ aap_token }}"
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
      register: _event_streams_response

    - name: Ensure event streams are in production mode
      ansible.builtin.uri:
        url: "{{ aap_hostname }}/api/eda/v1/event-streams/{{ item.id }}/"
        method: PATCH
        headers:
          Authorization: "Bearer {{ aap_token }}"
        body_format: json
        body:
          test_mode: false
        validate_certs: "{{ aap_validate_certs }}"
        status_code: [200]
      loop: "{{ _event_streams_response.json.results }}"
      loop_control:
        label: "{{ item.name }}"
