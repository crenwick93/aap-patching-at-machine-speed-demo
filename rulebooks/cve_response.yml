---
- name: CVE Response
  hosts: all
  sources:
    - name: insights_events
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Critical CVE detected on Trading Platform host
      condition: event.payload.application is defined and event.payload.application == "vulnerability"
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.payload.advisory_id
      action:
        run_workflow_template:
          name: "CVE Kpatch Response"
          organization: Default
          job_args:
            extra_vars:
              affected_host: "{{ event.payload.context.display_name | default('unknown') }}"
              triggered_cve: "{{ event.payload.events[0].payload.reported_cve | default('Unknown') }}"
              cve_list: "{{ event.payload.events | map(attribute='payload.reported_cve') | list | default([]) }}"
              severity: "{{ event.payload.source.event_type.display_name | default('Critical') }}"
              advisory_id: "{{ event.payload.advisory_id | default('Unknown') }}"

- name: ServiceNow CR Approval Bridge
  hosts: all
  sources:
    - servicenow.itsm.records:
        table: change_request
        instance:
          host: "{{ SN_HOST }}"
          username: "{{ SN_USERNAME }}"
          password: "{{ SN_PASSWORD }}"
        interval: 30
        columns:
          - sys_id
          - number
          - approval
          - state
          - short_description
        sysparm_query: "approval=approved^state!=implement^short_descriptionLIKEEmergency kpatch"
  rules:
    - name: Emergency CR approved — relay approval to AAP
      condition: event.approval == "approved"
      action:
        run_job_template:
          name: "Bridge CR Approval"
          organization: Default
          job_args:
            extra_vars:
              cr_number: "{{ event.number }}"
              cr_sys_id: "{{ event.sys_id }}"
