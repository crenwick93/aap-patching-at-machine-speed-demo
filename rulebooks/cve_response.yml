---
- name: CVE Response
  hosts: all
  sources:
    - name: insights_events
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Critical CVE advisory detected
      condition: event.payload.application == "vulnerability"
      action:
        run_workflow_template:
          name: "CVE Kpatch Response"
          organization: Default
          job_args:
            extra_vars:
              advisory_id: "{{ event.payload.advisory_id | default('RHSA-SIMULATED') }}"
              severity: "{{ event.payload.severity | default('Critical') }}"
              cve_list: "{{ event.payload.cve_list | default([]) }}"

- name: ServiceNow CR Approval Bridge
  hosts: all
  sources:
    - servicenow.itsm.records:
        table: change_request
        instance:
          host: "{{ SN_HOST }}"
          username: "{{ SN_USERNAME }}"
          password: "{{ SN_PASSWORD }}"
        interval: 30
        columns:
          - sys_id
          - number
          - approval
          - state
          - short_description
        sysparm_query: "approval=approved^state!=implement^short_descriptionLIKEEmergency kpatch"
  rules:
    - name: Emergency CR approved — relay approval to AAP
      condition: event.approval == "approved"
      action:
        run_job_template:
          name: "Bridge CR Approval"
          organization: Default
          job_args:
            extra_vars:
              cr_number: "{{ event.number }}"
              cr_sys_id: "{{ event.sys_id }}"
