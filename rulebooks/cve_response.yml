---
- name: CVE Response
  hosts: all
  sources:
    - name: insights_events
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Critical CVE detected on Trading Platform host
      condition: event.payload.payload.application is defined and event.payload.payload.application == "vulnerability"
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.payload.payload.advisory_id
      action:
        run_workflow_template:
          name: "CVE Kpatch Response"
          organization: Default
          job_args:
            extra_vars:
              affected_host: "{{ event.payload.payload.context.display_name }}"
              triggered_cve: "{{ event.payload.payload.events[0].payload.reported_cve }}"
              cve_list: "{{ event.payload.payload.events | map(attribute='payload.reported_cve') | list }}"
              severity: "Critical"
              advisory_id: "{{ event.payload.payload.advisory_id }}"

- name: ServiceNow CR Approval Bridge
  hosts: all
  execution_strategy: parallel
  sources:
    - servicenow.itsm.records:
        table: change_request
        interval: 30
        remote_servicenow_timezone: "Europe/London"
        sysparm_query: >
          state=-1^short_descriptionLIKEEmergency kpatch
      filters:
        - ansible.eda.json_filter:
        - ansible.eda.normalize_keys:
  rules:
    - name: Emergency CR moved to Implement — relay approval to AAP
      throttle:
        once_within: 10 minutes
        group_by_attributes:
          - sys_id
      condition: event.number is defined
      action:
        run_job_template:
          name: "Bridge CR Approval"
          organization: Default
          job_args:
            extra_vars:
              cr_number: "{{ event.number }}"
              cr_sys_id: "{{ event.sys_id }}"
